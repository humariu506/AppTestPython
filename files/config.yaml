# Configuration NRTK Test Program
# Réseau Centipede RTK — 5 balises pour mode NRTK/VRS

# --- Capteur GNSS ---
sensor:
  port: "COM5"          # Linux — changer en "COMX" sous Windows
  baudrate: 115200
  timeout: 2.0
  mock: true # true = données simulées, false = capteur réel
  antenna_height: 1.75  # Hauteur de l'antenne au-dessus du sol (m) — soustraite de l'altitude

# --- Balises Centipede (NTRIP) ---
# Choisir 5 balises proches de votre position de travail
# Liste complète : https://centipede.fr/

bases:
#  - id: "81"
#    host: "crtk.net"
#    port: 2101
#    mountpoint: "OUIL"          # Remplacer par les mountpoints réels
#    lat: 48.9229               # Latitude approx. de la balise
#    lon: 2.1776
#    alt: 86.5613
  - id: "1220"
    host: "crtk.net"
    port: 2101
    mountpoint: "IPGP"
    lat: 48.8449
    lon: 2.3563
    alt: 104.6638
  - id: "825"
    host: "crtk.net"
    port: 2101
    mountpoint: "RICE"
    lat: 48.7815
    lon: 2.4300
    alt: 87.0478
  - id: "383"
    host: "crtk.net"
    port: 2101
    mountpoint: "GEODATA2"
    lat: 48.8411
    lon: 2.5873
    alt: 160.528
  - id: "351"
    host: "crtk.net"
    port: 2101
    mountpoint: "CDFX"
    lat: 48.7070
    lon: 1.9796
    alt: 206.8928

# --- NTRIP credentials ---
ntrip:
  mock: false                  # true = bases simulées, false = vraies bases (mode hybride possible)
  user: "centipede"
  password: "centipede"
  version: 2                    # NTRIP v2 recommandé

# --- RTKLIB ---
rtklib:
  # Chemin vers rtkrcv ou rtkpost (RTKLIB compilé)
  # Chemins relatifs à ce fichier config.yaml pour rester portable.
  # Le dossier RTKLIB-master est au même niveau que le dossier files.
  # Exemple Windows compilé : "../RTKLIB-master/app/rtkpost/rtkpost.exe"
  rtkrcv_path: "../RTKLIB-master/app/rtkrcv/rtkrcv.c"
  rtkpost_path: "../RTKLIB-master/app/rtkpost/rtkpost.cpp"
  # Mode de positionnement : kinematic = RTK temps réel
  mode: "kinematic"
  # Fréquences : 1=L1 seulement, 2=L1+L2 (selon capteur)
  freq: 1
  # Elevation mask (degrés) — exclure satellites bas sur horizon
  elev_mask: 10
  # Systèmes GNSS activés (GPS+GLONASS+Galileo)
  navsys: 7
  # Seuil ratio pour fix ambiguïté (AR ratio)
  ar_ratio: 3.0
  # Timeout fix (secondes)
  fix_timeout: 60

# --- VRS ---
# Dans les deux modes ci-dessous, le flux RTCM brut de la première balise est
# forwardé au UM980 et garantit le FIX RTK. La différence porte sur ce qui se
# passe à côté pour la télémétrie/UI/API :
#   enabled: true  → mode HYBRIDE — le moteur VRS calcule l'interpolation
#                    multi-balises et publie les positions VRS dans l'UI/API.
#                    Le RTCM synthétisé n'est PAS poussé vers le UM980 tant
#                    que son encodage 1004 n'est pas conforme (voir le skill
#                    `nrtk-vrs-hybrid` pour le détail).
#   enabled: false → mode PONT DIRECT — le moteur VRS ne tourne pas, seule la
#                    position du UM980 (GGA) est affichée.
vrs:
  enabled: true

# --- Mock ---
mock:
  # Position simulée du capteur
  rover_lat: 48.8300
  rover_lon: 2.3700
  rover_alt: 42.0
  # Bruit simulé sur la position brute (mètres)
  position_noise: 0.035
  # Cadence NMEA (Hz)
  nmea_rate: 1
  # Cadence RTCM par base (Hz)
  rtcm_rate: 1
  # Simulation de perte de signal occasionnelle
  dropout_prob: 0.02

# --- UI ---
ui:
  update_rate_ms: 500           # Rafraîchissement de l'interface (ms)
  coordinate_decimals: 8        # Décimales affichées lat/lon
  show_satellite_count: true
  show_rtcm_age: true

# --- Serveur HTTP (Option A : dashboard stdlib, polling JS) ---
# Mini-serveur sans dépendance externe. Sert un dashboard humain accessible
# au navigateur, et expose /api/position, /api/bases, /api/status en JSON.
http:
  enabled: true                # true pour exposer le dashboard
  host: "0.0.0.0"               # 127.0.0.1 pour limiter à la machine locale
  port: 8080
  refresh_ms: 500               # cadence du polling côté navigateur

# --- API REST + WebSocket (Option C : intégration mobile via FastAPI) ---
# Sert la même donnée que ci-dessus mais pour un client programmatique
# (notamment l'application Android). Documentation OpenAPI auto-générée sur
# /docs, WebSocket de push temps réel sur /ws/position.
# Nécessite : `uv add fastapi uvicorn`.
api:
  enabled: true                # true pour exposer l'API mobile
  host: "0.0.0.0"
  port: 8081
  cors: true                    # autorise toute origine (utile en dev mobile)
